<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema PIX - Hubpague</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.1);
      max-width: 500px;
    }
    h1 { color: #333; margin: 0 0 10px 0; }
    p { color: #666; margin: 10px 0; }
    .status { color: #4CAF50; font-weight: bold; }
    a {
      display: inline-block;
      margin-top: 20px;
      padding: 10px 20px;
      background: #667eea;
      color: white;
      text-decoration: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🚀 Sistema PIX Online!</h1>
    <p class="status">✓ Servidor funcionando</p>
    <p>Seu sistema de pagamento está pronto!</p>
    <p>Acesse os endpoints da API para começar.</p>
    <a href="/api/health">Verificar Status</a>
  </div>
</body>
</html>
